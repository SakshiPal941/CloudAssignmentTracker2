server {
	listen 80;

	# server_name sets which hostname must appear in the request's Host
	# header to match this server block. For the default server (this
	# file) this value is not decisive, as it's used as the last resort
	# regardless. However, you should set it for any further server
	# block explicitly.
	#server_name www.example.com;

	# insert pathway old: /vagrant/Frontend; to /var/www/html
	index index.html;

	location / {
		try_files $uri $uri/ =404;
	}

	# Proxy any /api/... requests through to the Spring Boot backend.
	# Add CORS headers so the browser accepts JSON POST/PUT requests from the frontend.
	location /api/ {
		if ($request_method = OPTIONS) {
			add_header 'Access-Control-Allow-Origin' '*' always;
			add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
			add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
			add_header 'Access-Control-Max-Age' 1728000 always;
			return 204;
		}

		# proxy_pass http://192.168.2.13:8080;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		add_header 'Access-Control-Allow-Origin' '*' always;
		add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
		add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
	}

	# Available log levels: debug, info, notice, warn, error, crit, alert, emerg.
	error_log /var/log/nginx/error.log warn;
	access_log /var/log/nginx/access.log;
}

